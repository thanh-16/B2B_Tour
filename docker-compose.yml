name: b2b-travel-platform

services:
  postgres-local:
    image: postgres:16-alpine
    container_name: b2b_postgres_local
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: b2b_travel
      POSTGRES_USER: b2b_admin
      POSTGRES_PASSWORD: LocalDevPassword2026!
    volumes:
      - ./db/scripts/full_schema.sql:/docker-entrypoint-initdb.d/01_full_schema.sql
      - ./db/seeds/seed_all.sql:/docker-entrypoint-initdb.d/02_seed_all.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b_admin -d b2b_travel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-local:
    image: redis:7-alpine
    container_name: b2b_redis_local
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
